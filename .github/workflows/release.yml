# Publishes the plugin for Windows, macOS and Linux when a version tag such as
# v0.1.0 is pushed. The tag must equal the version the plugin reports (webhook.go).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: anant-barlota/girvi-plugins/.github/workflows/release-plugin.yml@176f4b3313fdd521db3cd349daf954a11a89aa2a # v0.1.0-alpha.9
    with:
      name: webhook
