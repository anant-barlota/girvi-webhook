# Push a tag such as v0.1.0, equal to "version" in plugin.json, to build the
# bundle and publish it with its SHA-256 as a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: anant-barlota/girvi-sdk/.github/workflows/release-plugin.yml@44f7143625975deaf01480943e7a0bc37469b57a # v0.0.2
